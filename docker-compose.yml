services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend, frontend]
    restart: unless-stopped

  backend:
    build: ./backend
    dns_opt:
      - single-request-reopen
    environment:
      DATABASE_URL: postgresql+asyncpg://argus:argus@postgres:5432/argus
      LOG_LEVEL: INFO
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [backend]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
